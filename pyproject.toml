[project]
name = "legal-intelligence-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Subrata Kumar Rana", email = "subratarana2016@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "ipykernel>=7.3.0",
    "langchain>=1.3.15",
    "langchain-ollama>=1.1.0",
    "numpy>=2.5.2",
    "pgvector>=0.5.0",
    "psycopg2>=2.9.12",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "streamlit>=1.61.1",
]

[project.scripts]
legal-intelligence-platform = "legal_intelligence_platform:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
